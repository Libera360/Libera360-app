<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asesor IA Libera 360</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; }
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
    .logo-text { font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; }
    .logo-text span { color: #F39644; }
    .logo-subtitle { color: #888; margin-top: 8px; font-size: 0.95rem; text-align: center; }
    .login-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; margin-top: 32px; }
    .login-box h2 { font-size: 1.3rem; margin-bottom: 24px; color: #fff; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 16px; background: #111; border: 1px solid #333; border-radius: 10px; color: #e8e8e8; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #F39644; }
    .btn-primary { width: 100%; padding: 14px; background: #F39644; color: #000; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; text-align: center; }
    #app-screen { display: none; flex-direction: column; height: 100vh; }
    .header { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header-logo { font-size: 1.3rem; font-weight: 900; }
    .header-logo span { color: #F39644; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 0.8rem; color: #666; }
    .btn-logout { background: none; border: 1px solid #333; color: #888; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
    .btn-logout:hover { border-color: #F39644; color: #F39644; }
    .new-chat-btn { background: none; border: 1px solid #333; color: #888; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
    .new-chat-btn:hover { border-color: #F39644; color: #F39644; }
    .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 860px; width: 100%; margin: 0 auto; }
    .message { display: flex; gap: 12px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { flex-direction: row-reverse; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
    .avatar.assistant { background: #F39644; color: #000; }
    .avatar.user { background: #333; color: #fff; }
    .bubble { max-width: 75%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; }
    .bubble.assistant { background: #1a1a1a; border: 1px solid #2a2a2a; border-top-left-radius: 4px; }
    .bubble.user { background: #F39644; color: #000; border-top-right-radius: 4px; }
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { color: #F39644; }
    .bubble.user strong { color: #000; }
    .bubble h3 { color: #F39644; margin: 12px 0 6px; font-size: 1rem; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 8px 0; }
    .bubble li { margin-bottom: 4px; }
    .typing-indicator { display: flex; gap: 12px; align-items: center; }
    .typing-dots { display: flex; gap: 4px; padding: 14px 18px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; border-top-left-radius: 4px; }
    .dot { width: 8px; height: 8px; background: #F39644; border-radius: 50%; animation: bounce 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    .input-area { background: #1a1a1a; border-top: 1px solid #2a2a2a; padding: 16px 24px; }
    .input-wrapper { max-width: 860px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end; }
    #user-input { flex: 1; background: #111; border: 1px solid #333; border-radius: 12px; color: #e8e8e8; font-size: 0.95rem; padding: 12px 16px; resize: none; outline: none; max-height: 120px; min-height: 48px; font-family: inherit; transition: border-color 0.2s; }
    #user-input:focus { border-color: #F39644; }
    .btn-send { background: #F39644; border: none; border-radius: 12px; width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; flex-shrink: 0; }
    .btn-send:hover { opacity: 0.9; }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-send svg { width: 20px; height: 20px; fill: #000; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="logo-text"><img src="/LOGO_LIBERA.PNG" alt="Libera360" style="height:80px; width:auto;"></div>
  <div class="logo-subtitle">Asesor IA · Metodología Empresarial</div>
  <div class="login-box">
    <h2>Accede a tu asesor</h2>
    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" id="email-input" placeholder="tu@correo.com">
    </div>
    <div class="form-group">
      <label>Código de acceso</label>
      <input type="text" id="code-input" placeholder="Código de acceso" style="text-transform:uppercase">
    </div>
    <button class="btn-primary" id="login-btn" onclick="handleLogin()">Ingresar</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<div id="app-screen">
  <div class="header">
    <div class="header-logo"><img src="/LOGO_LIBERA.PNG" alt="Libera360" style="height:40px; width:auto;"></div>
    <div class="header-right">
      <button class="new-chat-btn" onclick="newChat()">+ Nueva sesión</button>
      <span class="user-email" id="user-email-display"></span>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="chat-container" id="chat-container"></div>
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="user-input" placeholder="Escribe tu respuesta aquí..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  let currentUser = null;
  let conversationHistory = [];
  let sessionId = null;
  let isLoading = false;

  window.onload = function() {
    const saved = localStorage.getItem('libera360_user');
    if (saved) { currentUser = JSON.parse(saved); showApp(); startSession(); }
  };

  async function handleLogin() {
    const email = document.getElementById('email-input').value.trim();
    const code = document.getElementById('code-input').value.trim();
    const errorDiv = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    if (!email || !code) { errorDiv.textContent = 'Ingresa tu correo y código.'; return; }
    btn.disabled = true; btn.textContent = 'Ingresando...'; errorDiv.textContent = '';
    try {
      const res = await fetch('/api/auth/access', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, code }) });
      const data = await res.json();
      if (!res.ok) { errorDiv.textContent = data.error || 'Error al ingresar.'; return; }
      currentUser = data.user;
      localStorage.setItem('libera360_user', JSON.stringify(currentUser));
      showApp(); startSession();
    } catch(e) { errorDiv.textContent = 'Error de conexión.'; }
    finally { btn.disabled = false; btn.textContent = 'Ingresar'; }
  }

  function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    document.getElementById('user-email-display').textContent = currentUser.email;
  }

  function startSession() {
    sessionId = 'session_' + Date.now();
    conversationHistory = [];
    document.getElementById('chat-container').innerHTML = '';
    setTimeout(() => { sendToAPI([{ role: 'user', content: 'Hola, quiero empezar.' }]); }, 500);
  }

  function newChat() {
    if (confirm('¿Iniciar nueva sesión?')) startSession();
  }

  function logout() {
    localStorage.removeItem('libera360_user');
    currentUser = null; conversationHistory = [];
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text || isLoading) return;
    input.value = ''; input.style.height = '48px';
    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });
    await sendToAPI(conversationHistory);
  }

  async function sendToAPI(messages) {
    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    showTyping();
    try {
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages, userId: currentUser?.id, sessionId }) });
      const data = await res.json();
      hideTyping();
      if (!res.ok) throw new Error(data.error);
      conversationHistory.push({ role: 'assistant', content: data.message });
      addMessage('assistant', data.message);
    } catch(e) { hideTyping(); addMessage('assistant', 'Error al procesar. Intenta de nuevo.'); }
    finally { isLoading = false; document.getElementById('send-btn').disabled = false; }
  }

  function addMessage(role, content) {
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'assistant' ? 'L' : 'Tú';
    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.innerHTML = formatMessage(content);
    div.appendChild(avatar); div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function formatMessage(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^### (.*$)/gm, '<h3>$1</h3>')
      .replace(/^## (.*$)/gm, '<h3>$1</h3>')
      .replace(/^- (.*$)/gm, '<li>$1</li>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    const container = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = 'typing-indicator'; div.id = 'typing';
    const avatar = document.createElement('div');
    avatar.className = 'avatar assistant'; avatar.textContent = 'L';
    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    div.appendChild(avatar); div.appendChild(dots);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function hideTyping() { const t = document.getElementById('typing'); if(t) t.remove(); }
  function handleKeyDown(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
</script>
</body>
</html>
